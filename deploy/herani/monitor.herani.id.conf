# The maintainer's own instance: https://monitor.herani.id (Cloudflare proxied, SSL Flexible).
# Installed by scripts/deploy-to-server.sh to /etc/nginx/sites-available/monitor.herani.id.
# Real visitor IP comes from /etc/nginx/conf.d/cloudflare-realip.conf.
server {
    listen 80;
    listen [::]:80;
    server_name monitor.herani.id;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location / {
        proxy_pass http://127.0.0.1:3900;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;                        # live logs (SSE)
        proxy_read_timeout 3600s;
        client_max_body_size 10m;
    }
}
