# Hardening for the Server Manager app herani-page (Bun). No MemoryDenyWriteExecute (Bun's JIT
# needs W+X pages) and no ReadWritePaths (it writes nothing; uploads go to S3).
# Installed to /etc/systemd/system/app-herani-page.service.d/hardening.conf; server-manager rewrites
# only app-herani-page.service itself, never this drop-in.
[Service]
UMask=0077
MemoryMax=500M
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=read-only
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictSUIDSGID=yes
RestrictRealtime=yes
RestrictNamespaces=yes
LockPersonality=yes
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
CapabilityBoundingSet=
AmbientCapabilities=
SystemCallArchitectures=native
SystemCallFilter=@system-service
