# Hardening for the Server Manager app design-board (kept from its old unit, see docs/DEPLOY-herani.md).
# Installed to /etc/systemd/system/app-design-board.service.d/hardening.conf; server-manager rewrites only
# app-design-board.service itself, never this drop-in.
[Service]
UMask=0077
MemoryMax=512M
NoNewPrivileges=yes
ProtectSystem=strict
ReadWritePaths=/var/lib/design-board
ProtectHome=read-only
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictSUIDSGID=yes
RestrictRealtime=yes
RestrictNamespaces=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
CapabilityBoundingSet=
AmbientCapabilities=
SystemCallArchitectures=native
SystemCallFilter=@system-service
